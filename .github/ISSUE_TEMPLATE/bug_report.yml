name: Bug report
description: Report something that doesn't work the way the README says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **For security vulnerabilities, do not use this form** —
        see [SECURITY.md](https://github.com/matelang/jwt-go-aws-kms/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Module version
      description: Output of `go list -m github.com/matelang/jwt-go-aws-kms/v2`
      placeholder: e.g. v2.3.0 or v2.0.0-YYYYMMDDhhmmss-abcdef
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: e.g. go1.26.1
    validations:
      required: true
  - type: dropdown
    id: alg
    attributes:
      label: JWT algorithm
      options:
        - ES256
        - ES384
        - ES512
        - RS256
        - RS384
        - RS512
        - PS256
        - PS384
        - PS512
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro
      description: Minimal Go code or test that triggers the issue.
      render: go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any error messages and stack traces (use code blocks).
    validations:
      required: true
