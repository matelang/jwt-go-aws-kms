name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [ '1.26.x', '1.27.x' ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build -v ./...

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out -v ./...

      - name: Upload coverage artifact
        if: matrix.go == '1.27.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  # Branch protection requires a check named "build". This job gives the
  # matrix one stable name, so the Go versions can change without a
  # settings change. It runs even when a matrix job fails, and fails then.
  build:
    name: build
    needs: build-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: test "${{ needs.build-test.result }}" = "success"
